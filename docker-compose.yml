services:
  redpanda-1:
    image: docker.redpanda.com/redpandadata/redpanda:v23.1.8
    container_name: redpanda-1
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '1'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda-1:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:28082,OUTSIDE://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://redpanda-1:28082,OUTSIDE://localhost:8082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda-1:33145
    ports:
      # - 8081:8081
      - 8082:8082
      - 9092:9092
      - 28082:28082
      - 29092:29092
    networks:
      - algotradingenvju

  redpanda-2:
     image: docker.redpanda.com/redpandadata/redpanda:v23.1.8
     container_name: redpanda-2
     command:
       - redpanda
       - start
       - --smp
       - '1'
       - --reserve-memory
       - 0M
       - --overprovisioned
       - --node-id
       - '2'
       - --seeds
       - redpanda-1:33145
       - --kafka-addr
       - PLAINTEXT://0.0.0.0:29093,OUTSIDE://0.0.0.0:9093
       - --advertise-kafka-addr
       - PLAINTEXT://redpanda-2:29093,OUTSIDE://localhost:9093
       - --pandaproxy-addr
       - PLAINTEXT://0.0.0.0:28083,OUTSIDE://0.0.0.0:8083
       - --advertise-pandaproxy-addr
       - PLAINTEXT://redpanda-2:28083,OUTSIDE://localhost:8083
       - --rpc-addr
       - 0.0.0.0:33146
       - --advertise-rpc-addr
       - redpanda-2:33146
     ports:
       - 8083:8083
       - 9093:9093
       - 28083:28083
       - 29093:29093
     networks:
       - algotradingenvju

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.2.4
    container_name: redpanda-console
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-1:29092", "redpanda-2:29093"]
          schemaRegistry:
            enabled: false
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-1:9644", "http://redpanda-2:9644"]
        connect:
          enabled: false
    ports:
      - 8080:8080
    depends_on:
      - redpanda-1
      - redpanda-2
    networks:
      - algotradingenvju

  # Flink cluster
  jobmanager:
    container_name: jobmanager
    build:
      context: .
      dockerfile: Dockerfile-sql
    ports:
      - 8081:8081
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.bind-host: 0.0.0.0
        rest.address: jobmanager
        rest.port: 8081
        rest.bind-address: 0.0.0.0
        state.backend: hashmap
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.min-pause: 5s
        execution.checkpointing.timeout: 1min
    volumes:
      - ./data/flink/checkpoints:/opt/flink/checkpoints
      - ./data/flink/savepoints:/opt/flink/savepoints
    networks:
      - algotradingenvju

  taskmanager:
    container_name: taskmanager
    build:
      context: .
      dockerfile: Dockerfile-sql
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 20
        taskmanager.bind-host: 0.0.0.0
        state.backend: hashmap
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
    volumes:
      - ./data/flink/checkpoints:/opt/flink/checkpoints
      - ./data/flink/savepoints:/opt/flink/savepoints
    networks:
      - algotradingenvju

  sql-client:
    container_name: sql-client
    build:
      context: .
      dockerfile: Dockerfile-sql
    command:
      - /opt/flink/bin/sql-client.sh
      - embedded
      - -l
      - /opt/sql-client/lib
    depends_on:
      - jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        jobmanager.rpc.port: 6123
        rest.address: jobmanager
        rest.port: 8081
    networks:
      - algotradingenvju

  price-producer:
    container_name: price-producer
    build:
      context: .
      dockerfile: Dockerfile-producers
    command: python continuous_price_producer.py
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      - redpanda-1
      - redpanda-2
    environment:
      - REDPANDA_BROKERS=redpanda-1:29092,redpanda-2:29093
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    networks:
      - algotradingenvju

  news-producer:
    container_name: news-producer
    build:
      context: .
      dockerfile: Dockerfile-producers
    command: python continuous_news_producer.py
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      - redpanda-1
      - redpanda-2
    environment:
      - REDPANDA_BROKERS=redpanda-1:29092,redpanda-2:29093
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    networks:
      - algotradingenvju

  crypto-producer:
    container_name: crypto-producer
    build:
      context: .
      dockerfile: Dockerfile-producers
    command: python continuous_crypto_producer.py
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      - redpanda-1
      - redpanda-2
    environment:
      - REDPANDA_BROKERS=redpanda-1:29092,redpanda-2:29093
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./continuous_crypto_producer.py:/app/continuous_crypto_producer.py:ro
    networks:
      - algotradingenvju

  crypto-signal-handler:
    container_name: crypto-signal-handler
    build:
      context: .
      dockerfile: Dockerfile-producers
    command: python crypto_signal_handler.py
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      - redpanda-1
      - redpanda-2
    environment:
      - REDPANDA_BROKERS=redpanda-1:29092,redpanda-2:29093
      - PYTHONUNBUFFERED=1
      - TRADING_MODE=DRY_RUN
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
      - ./crypto_signal_handler.py:/app/crypto_signal_handler.py:ro
    networks:
      - algotradingenvju

networks:
  algotradingenvju: